name: Dynamic Metrics Sync Dashboard

on:
  schedule:
    - cron: '0 0 1 * *'   # 1st of every month at 12:00 AM UTC
    - cron: '0 9 * * 1'   # Every Monday at 9:00 AM UTC
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Run mode: monthly or weekly'
        required: true
        default: 'weekly'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Copy Repo Code
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pandas gspread google-auth google-cloud-storage

      - name: Determine Run Mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RUN_MODE=${{ github.event.inputs.run_mode }}" >> $GITHUB_ENV
          elif [ "$(date +%d)" = "01" ]; then
            echo "RUN_MODE=monthly" >> $GITHUB_ENV
          else
            echo "RUN_MODE=weekly" >> $GITHUB_ENV
          fi

      - name: Execute Pipeline Script
        env:
          GOOGLE_BUCKET_NAME:       ${{ secrets.GOOGLE_BUCKET_NAME }}
          ANDROID_PACKAGE_NAME:     ${{ secrets.ANDROID_PACKAGE_NAME }}
          GCP_SERVICE_ACCOUNT_KEY:  ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          IOS_TOTAL_DOWNLOADS:      ${{ secrets.IOS_TOTAL_DOWNLOADS }}
        run: python update_stats.py

      - name: Commit Changes To Main Branch
        run: |
          git config --global user.name 'Stats-Dashboard-Bot'
          git config --global user.email 'dashboard-bot@github.com'
          git fetch origin main
          git reset --hard origin/main
          python update_stats.py
          git add README.md
          git diff-index --quiet HEAD || git commit -m "docs: sync download statistics [skip ci]"
          git push
