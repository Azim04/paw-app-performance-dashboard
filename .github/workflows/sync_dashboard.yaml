name: Dynamic Metrics Sync Dashboard

on:
  schedule:
    - cron: '0 2 * * 0'  # Runs every Sunday at 2:00 AM
    - cron: '0 2 1 * *'  # Runs on the 1st of every month at 2:00 AM
  workflow_dispatch:     # Allows you to force trigger it manually anytime!

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Copy Repo Code
      uses: actions/checkout@v4

    - name: Initialize Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Data Packages
      run: pip install pandas

    - name: Execute Painter Script
      run: python update_stats.py

    - name: Commit Changes To Main Branch
      run: |
        git config --global user.name 'Stats-Dashboard-Bot'
        git config --global user.email 'dashboard-bot@github.com'
        git add README.md
        git diff-index --quiet HEAD || git commit -m "docs: sync download statistics [skip ci]"
        git push
